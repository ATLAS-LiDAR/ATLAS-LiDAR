[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-lidar"
version = "0.1.0"
description = "ATLAS: a LiDAR spoofing attack, with an interactive sandbox for it"
readme = "README.md"
requires-python = ">=3.8"
# numpy is the ONLY hard dependency. That is the point of the extraction: the
# attack's physics does not need torch, CUDA, OpenPCDet or a checkpoint directory,
# and keeping it that way is what lets cross-validation run in CI.
dependencies = ["numpy>=1.20"]

[project.optional-dependencies]
# removal.py imports matplotlib and plotly at module level for its plotting
# helpers, so importing it currently REQUIRES this extra even though the physics
# does not use them. Installing it is the workaround until that import is made lazy.
plot = ["matplotlib", "plotly"]

[tool.setuptools]
# Only the attack package is installable. The sandbox is a static web app served
# as files, not a Python module, and tools/ are development scripts run in place.
packages = ["atlas"]

[tool.setuptools.package-data]
# the measured calibration assets the modules load at import time
atlas = ["*.npy", "assets_kitti/*.npy", "assets_trainval/*.npy", "PROVENANCE.json"]
