[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-lidar"
version = "0.1.0"
description = "ATLAS: a LiDAR spoofing attack, with an interactive sandbox for it"
readme = "README.md"
requires-python = ">=3.8"
# numpy is the ONLY hard dependency. That is the point of the extraction: the
# attack's physics does not need torch, CUDA, OpenPCDet or a checkpoint directory,
# and keeping it that way is what lets cross-validation run in CI.
dependencies = ["numpy>=1.20"]

[project.optional-dependencies]
# The attack's physics needs none of these. They are what the surrounding harness
# needs, and they are extras precisely so that `pip install atlas-lidar` keeps
# giving you a numpy-only attack.
#
# gen   dataset generation (atlas/generate_data_*.py, atlas/build_*_assets.py).
#       helpers_ptt.py pulls in torch and the plotting stack at module scope, and
#       the generators import pcdet lazily inside their data loaders.
# eval  the detector evaluation matrix (eval/). Beyond these, it needs OpenPCDet
#       and trained checkpoints, which is why it depends on a
#       Polar-Hierarchical-Mamba checkout rather than on a PyPI package - see
#       eval/README.md.
# viz   real-world validation plots and the qualitative figures.
plot = ["matplotlib", "plotly"]
gen = ["torch", "tqdm", "matplotlib", "plotly", "easydict", "pyyaml"]
eval = ["torch", "tqdm", "scipy", "easydict", "pyyaml"]
viz = ["matplotlib", "plotly", "scipy"]

[tool.setuptools]
# Only the attack package is installable. The sandbox is a static web app served
# as files, not a Python module, and tools/ are development scripts run in place.
packages = ["atlas"]

[tool.setuptools.package-data]
# the measured calibration assets the modules load at import time
atlas = ["*.npy", "assets_kitti/*.npy", "assets_trainval/*.npy", "PROVENANCE.json"]
